<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio">
  <title>Portfolio</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #f3f3f3; }
    body { overflow: hidden; }
    .viewer { width: 100%; height: 100%; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .fallback { padding: 1rem; font: 16px/1.5 Arial, sans-serif; text-align: center; }
    .fallback a { color: #1459c7; }
  </style>
</head>
<body>
  <main class="viewer">
    <iframe src="Portfolio.pdf#view=FitH" title="Portfolio PDF">
      <div class="fallback">
        Browser Anda tidak dapat menampilkan PDF secara langsung.
        <a href="Portfolio.pdf">Buka portfolio</a>.
      </div>
    </iframe>
  </main>
</body>
</html>
